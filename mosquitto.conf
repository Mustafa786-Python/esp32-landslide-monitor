# FloodGuard demonstration broker: keep this on a trusted local network only.
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# For an isolated demonstration without credentials only:
allow_anonymous true

# For a credentialed network, comment allow_anonymous and uncomment:
# allow_anonymous false
# password_file /etc/mosquitto/passwd

persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
